services:
  - type: web
    name: careerforge-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerforge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: APPLICATION_FEE_KOBO
        value: "3500000"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_CHAT_MODEL
        value: openai/gpt-oss-20b:free
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small

databases:
  - name: careerforge-db
    databaseName: careerforge
    user: careerforge
    plan: free
    region: oregon
